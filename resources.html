<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resources — Global Simulator Platform</title>
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div class="topnav">
  <a class="topnav-logo" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="3" width="8" height="8" rx="1.5" fill="white" opacity="0.9"/>
      <rect x="13" y="3" width="8" height="8" rx="1.5" fill="white" opacity="0.6"/>
      <rect x="3" y="13" width="8" height="8" rx="1.5" fill="white" opacity="0.6"/>
      <rect x="13" y="13" width="8" height="8" rx="1.5" fill="white" opacity="0.3"/>
    </svg>
    Global Simulator Platform
  </a>
  <nav class="topnav-links" aria-label="Main">
    <a href="index.html" class="nav-link">Plan</a>
    <a href="resources.html" class="nav-link active">Resources</a>
    <a href="bugs.html" class="nav-link">Bugs</a>
  </nav>
  <div class="topnav-right"><div class="avatar">AR</div></div>
</div>

<div class="breadcrumb">Global Simulator Platform <span>›</span> Resources</div>

<div class="page-header">
  <div class="page-icon">
    <svg viewBox="0 0 24 24" fill="white" width="18" height="18" aria-hidden="true"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
  </div>
  <h1>Resources</h1>
  <div class="header-right">
    <span>Last saved: <span id="last-saved">—</span></span>
    <button type="button" class="btn-create" onclick="openModal()">
      <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      Add link
    </button>
  </div>
</div>

<div class="stats-row">
  <div class="stat-card total"><div class="stat-num" id="st-total">—</div><div class="stat-label">Total</div></div>
  <div class="stat-card res-docs"><div class="stat-num" id="st-docs">—</div><div class="stat-label">Docs</div></div>
  <div class="stat-card s-progress"><div class="stat-num" id="st-tools">—</div><div class="stat-label">Tools</div></div>
  <div class="stat-card s-resolved"><div class="stat-num" id="st-contacts">—</div><div class="stat-label">Contacts</div></div>
  <div class="stat-card s-blocked"><div class="stat-num" id="st-other">—</div><div class="stat-label">Other</div></div>
</div>

<div class="toolbar">
  <button type="button" class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button type="button" class="filter-btn" onclick="setFilter('Docs',this)">Docs</button>
  <button type="button" class="filter-btn" onclick="setFilter('Tools',this)">Tools</button>
  <button type="button" class="filter-btn" onclick="setFilter('Contacts',this)">Contacts</button>
  <button type="button" class="filter-btn" onclick="setFilter('Other',this)">Other</button>
  <div class="toolbar-right">
    <select onchange="setSort(this.value)" aria-label="Sort">
      <option value="default">Sort: default</option>
      <option value="title">Sort: title</option>
      <option value="category">Sort: category</option>
    </select>
  </div>
</div>

<div class="issue-table-wrap" id="res-container"></div>

<div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2>Add resource</h2>
      <button type="button" class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="f-title">Title *</label>
        <input class="form-input" id="f-title" type="text" placeholder="Short label" />
        <span class="form-error" id="err-title">Required</span>
      </div>
      <div class="form-group">
        <label for="f-url">URL *</label>
        <input class="form-input" id="f-url" type="url" placeholder="https://…" />
        <span class="form-error" id="err-url">Enter a URL (https:// is added if missing)</span>
      </div>
      <div class="form-group">
        <label for="f-category">Category</label>
        <select class="form-select" id="f-category">
          <option value="Docs">Docs</option>
          <option value="Tools">Tools</option>
          <option value="Contacts">Contacts</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="f-notes">Notes</label>
        <textarea class="form-textarea" id="f-notes" placeholder="Optional context"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button type="button" class="btn-submit" onclick="submitRes()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Changes saved</div>

<script>
const STORAGE_KEY = 'gs_resources_v1';

const seed = [
  { id: 'R-01', title: 'Platform overview (internal)', url: 'https://example.com', category: 'Docs', notes: 'Replace with your real wiki or Confluence link.', updated: '' },
  { id: 'R-02', title: 'Status / incidents', url: 'https://example.com/status', category: 'Tools', notes: '', updated: '' },
];

let rows = [];
let currentFilter = 'all';
let currentSort = 'default';

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/"/g, '&quot;');
}

function normalizeUrl(u) {
  let t = String(u ?? '').trim();
  if (!t) return '';
  if (!/^https?:\/\//i.test(t)) t = 'https://' + t.replace(/^\/+/, '');
  return t;
}

function normalizeRow(r) {
  const x = { ...r };
  if (x.title === undefined || x.title === null) x.title = '';
  x.url = normalizeUrl(x.url);
  if (!['Docs', 'Tools', 'Contacts', 'Other'].includes(x.category)) x.category = 'Other';
  if (x.notes === undefined || x.notes === null) x.notes = '';
  if (x.updated === undefined || x.updated === null) x.updated = '';
  if (!x.id) x.id = nextId();
  return x;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    rows = raw ? JSON.parse(raw).map(normalizeRow) : seed.map(normalizeRow);
  } catch (e) {
    rows = seed.map(normalizeRow);
  }
}

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows)); } catch (e) {}
  const ts = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  document.getElementById('last-saved').textContent = ts;
  toast('Changes saved');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

function nextId() {
  const nums = rows.map(r => {
    const m = /^R-(\d+)$/.exec(r.id || '');
    return m ? parseInt(m[1], 10) : 0;
  });
  const max = nums.length ? Math.max(...nums) : 0;
  return 'R-' + String(max + 1).padStart(2, '0');
}

function updateStats() {
  const c = { Docs: 0, Tools: 0, Contacts: 0, Other: 0 };
  rows.forEach(r => { if (c[r.category] !== undefined) c[r.category]++; });
  document.getElementById('st-total').textContent = rows.length;
  document.getElementById('st-docs').textContent = c.Docs;
  document.getElementById('st-tools').textContent = c.Tools;
  document.getElementById('st-contacts').textContent = c.Contacts;
  document.getElementById('st-other').textContent = c.Other;
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.toolbar .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setSort(v) { currentSort = v; render(); }

function changeCategory(sel) {
  const row = rows.find(r => r.id === sel.dataset.id);
  if (!row) return;
  row.category = sel.value;
  row.updated = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const tag = document.getElementById('upd-' + row.id);
  if (tag) tag.textContent = row.updated ? 'Updated ' + row.updated : '—';
  persist();
  updateStats();
}

function inlineTitle(el) {
  const row = rows.find(r => r.id === el.dataset.id);
  if (row) { row.title = el.value; persist(); }
}

function inlineUrl(el) {
  const row = rows.find(r => r.id === el.dataset.id);
  if (!row) return;
  const u = normalizeUrl(el.value);
  row.url = u;
  el.value = u;
  persist();
  render();
}

function inlineNotes(el) {
  const row = rows.find(r => r.id === el.dataset.id);
  if (row) { row.notes = el.value; persist(); }
}

function deleteRow(id) {
  if (!confirm('Delete this resource?')) return;
  rows = rows.filter(r => r.id !== id);
  persist();
  render();
}

function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('f-title').value = '';
  document.getElementById('f-url').value = '';
  document.getElementById('f-category').value = 'Docs';
  document.getElementById('f-notes').value = '';
  document.getElementById('err-title').classList.remove('show');
  document.getElementById('err-url').classList.remove('show');
  document.getElementById('f-title').focus();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function overlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function submitRes() {
  const title = document.getElementById('f-title').value.trim();
  const urlRaw = document.getElementById('f-url').value.trim();
  let ok = true;
  if (!title) { document.getElementById('err-title').classList.add('show'); ok = false; }
  else document.getElementById('err-title').classList.remove('show');
  if (!urlRaw) { document.getElementById('err-url').classList.add('show'); ok = false; }
  else document.getElementById('err-url').classList.remove('show');
  if (!ok) return;

  const rec = normalizeRow({
    id: nextId(),
    title,
    url: urlRaw,
    category: document.getElementById('f-category').value,
    notes: document.getElementById('f-notes').value.trim(),
    updated: '',
  });
  rows.push(rec);
  persist();
  render();
  closeModal();
  toast('Added ' + rec.id);
}

function render() {
  let list = rows.filter(r => currentFilter === 'all' || r.category === currentFilter);
  if (currentSort === 'title') {
    list = [...list].sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  } else if (currentSort === 'category') {
    list = [...list].sort((a, b) => a.category.localeCompare(b.category) || (a.title || '').localeCompare(b.title || ''));
  }

  const container = document.getElementById('res-container');

  if (!list.length) {
    container.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text3);font-size:13px;">No resources match this filter. <button type="button" class="btn-create" style="margin-left:12px;" onclick="openModal()">Add one</button></div>';
    updateStats();
    return;
  }

  let html = '<table class="issue-table"><thead><tr>' +
    '<th style="width:56px">ID</th>' +
    '<th style="width:min(180px,18vw)">Title</th>' +
    '<th>URL</th>' +
    '<th style="width:112px">Category</th>' +
    '<th style="width:min(200px,20vw)">Notes</th>' +
    '<th style="width:88px">Updated</th>' +
    '<th style="width:36px"></th>' +
    '</tr></thead><tbody>';

  list.forEach(r => {
    const href = esc(r.url);
    const sel = ['Docs', 'Tools', 'Contacts', 'Other'].map(c =>
      '<option value="' + c + '"' + (c === r.category ? ' selected' : '') + '>' + c + '</option>').join('');
    html += '<tr>' +
      '<td class="td-id">' + esc(r.id) + '</td>' +
      '<td><input class="inline-input" type="text" data-id="' + esc(r.id) + '" value="' + esc(r.title) + '" onchange="inlineTitle(this)"/></td>' +
      '<td><input class="inline-input" type="text" data-id="' + esc(r.id) + '" value="' + esc(r.url) + '" onchange="inlineUrl(this)" spellcheck="false"/>' +
      (r.url ? '<div style="margin-top:4px"><a class="resource-link" href="' + href + '" target="_blank" rel="noopener noreferrer">Open in new tab</a></div>' : '') +
      '</td>' +
      '<td><select class="form-select" style="font-size:12px;padding:4px 8px" data-id="' + esc(r.id) + '" onchange="changeCategory(this)">' + sel + '</select></td>' +
      '<td><textarea class="notes-input" data-id="' + esc(r.id) + '" rows="1" placeholder="Notes…" onchange="inlineNotes(this)">' + esc(r.notes) + '</textarea></td>' +
      '<td><span class="updated-tag" id="upd-' + esc(r.id) + '">' + (r.updated ? 'Updated ' + esc(r.updated) : '—') + '</span></td>' +
      '<td><button type="button" class="btn-del" title="Delete" onclick="deleteRow(\'' + esc(r.id) + '\')">&#x2715;</button></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
  updateStats();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openModal(); }
});

load();
render();
</script>
</body>
</html>
